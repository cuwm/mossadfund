<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yzy.wtf</title>
  <meta property="og:title" content="yzy.wtf">
  <meta property="og:description" content="enter.">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #050505;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    a {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 700;
      color: transparent;
      text-decoration: none;
      letter-spacing: 0.05em;
      background: linear-gradient(120deg, #8b5cf6, #d946ef, #8b5cf6);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    a:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.5));
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .sub {
      font-family: "Unbounded", sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: #4a4a55;
      animation: blink 2.4s infinite;
    }
    @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <a href="/god.html">yzy.wtf</a>
  <div class="sub">[ click to enter ]</div>
