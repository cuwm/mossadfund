<script>
var CONFIG = {
  id: "1489019129728995509",
  slug: "idf",
  bio: "hi :p",
  music: "INSERT_MP3_URL",
  musicVolume: 0.45,
  links: [
    { name: "github", url: "https://github.com/cuwm",
      icon: "https://cdn.simpleicons.org/github/ffffff", copy: false },
    { name: "discord", url: "https://discord.com/users/1489019129728995509",
      icon: "https://cdn.simpleicons.org/discord/ffffff", copy: true },
    { name: "telegram", url: "https://t.me/realsistrs",
      icon: "https://cdn.simpleicons.org/telegram/26A5E4", copy: false }
  ],
  firebaseDbUrl: "https://guestbook-a7de7-default-rtdb.firebaseio.com"
};

(function () {
  "use strict";

  var discordUser = null;

  function $(x) { return document.getElementById(x); }

  function badgeUrl(hash)      { return "https://cdn.discordapp.com/badge-icons/" + hash + ".png"; }
  function decoPresetUrl(hash) { return "https://cdn.discordapp.com/avatar-decoration-presets/" + hash + ".png?size=160&passthrough=true"; }
  function profileDecoUrl(hash){ return "https://cdn.discordapp.com/assets/content/" + hash; }
  function nameplateUrl(np)    {
    return "https://cdn.discordapp.com/assets/collectibles/nameplates/" +
           np.collection + "/" + np.name + "/asset.webm";
  }

  function boot() {
    var musicWidget = $("musicWidget");
    var musicOn = false;

    if (CONFIG.music && CONFIG.music !== "INSERT_MP3_URL") {
      var preAudio = $("bgmusic");
      preAudio.src = CONFIG.music;
      preAudio.volume = CONFIG.musicVolume;
      preAudio.loop = true;
      preAudio.load();
    }

    function startMusic() {
      if (!CONFIG.music || CONFIG.music === "INSERT_MP3_URL") return;
      var audio = $("bgmusic");
      var p = audio.play();
      if (p && p.catch) p.catch(function () {
        toast("couldn't play music :(");
      });
      musicOn = true;
      musicWidget.classList.remove("muted");
      musicWidget.classList.add("on", "playing");
    }

    musicWidget.addEventListener("click", function (e) {
      e.stopPropagation();
      var audio = $("bgmusic");
      if (musicOn) {
        audio.pause();
        musicOn = false;
        musicWidget.classList.add("muted");
        musicWidget.classList.remove("playing");
      } else {
        audio.play().catch(function () {});
        musicOn = true;
        musicWidget.classList.remove("muted");
        musicWidget.classList.add("playing");
      }
    });

    var toastTimer;
    function toast(msg) {
      var t = $("toast");
      t.textContent = msg;
      t.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2200);
    }

    function copyText(text, cb) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { cb(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { cb(document.execCommand("copy")); } catch (e) { cb(false); }
        document.body.removeChild(ta);
      }
    }

    function showBox(el) { el.hidden = false; el.style.display = ""; updateCompact(); }
    function hideBox(el) { el.hidden = true; el.style.display = "none"; updateCompact(); }

    function updateCompact() {
      var actVisible = !$("actbox").hidden;
      var spVisible = !$("spbox").hidden;
      $("card").classList.toggle("compact", actVisible || spVisible);
    }

    /* verified badge popup */
    (function () {
      var badge = $("verifiedBadge");
      var popup = $("badgePopup");
      if (!badge || !popup) return;
      var hideTimer;
      function showPopup() {
        popup.classList.add("show");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hidePopup, 2200);
      }
      function hidePopup() { popup.classList.remove("show"); }
      badge.addEventListener("click", function (e) {
        e.stopPropagation();
        if (popup.classList.contains("show")) hidePopup(); else showPopup();
      });
      document.addEventListener("click", function () { hidePopup(); });
      popup.addEventListener("click", function (e) { e.stopPropagation(); });
    })();

    /* static text — FIXED: tetContent -> textContent */
    $("bio").textContent = CONFIG.bio;
    $("handle").textContent = "@" + CONFIG.slug;

    /* build links */
    CONFIG.links.forEach(function (l) {
      var a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<img src="' + l.icon + '" alt=""><span>' + l.name + '</span>';
      if (l.copy) {
        a.classList.add("copyable");
        a.addEventListener("click", function (e) {
          if (!discordUser) return;
          e.preventDefault();
          copyText(discordUser, function (ok) {
            toast(ok ? "copied @" + discordUser : "couldn't copy :(");
          });
        });
      }
      $("links").appendChild(a);
    });

    var socialsToggle = $("socialsToggle");
    var linksNav = $("links");
    var card = $("card");
    socialsToggle.addEventListener("click", function () {
      var open = linksNav.classList.toggle("open");
      socialsToggle.setAttribute("aria-expanded", open ? "true" : "false");
      card.classList.toggle("socials-open", open);
    });

    /* enter click */
    $("enter").onclick = function () {
      this.classList.add("off");
      $("card").classList.add("show");
      try { load(); }       catch (e) { console.warn("load failed", e); }
      try { loadDstn(); }   catch (e) { console.warn("loadDstn failed", e); }
      try { startMusic(); } catch (e) { console.warn("startMusic failed", e); }
    };

    /* ---------- views counter ---------- */
    var VIEW_WINDOW_MS = 15 * 60 * 1000;
    var gbClientIp = null;

    function getClientIp() {
      if (gbClientIp) return Promise.resolve(gbClientIp);
      return fetch("https://api.ipify.org?format=json")
        .then(function (r) { return r.json(); })
        .then(function (d) { gbClientIp = d.ip; return gbClientIp; })
        .catch(function () { return null; });
    }
    function ipKey(ip) { return ip.replace(/[.#$\[\]:]/g, "_"); }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fbIsRulesError(obj) {
      return !!(obj && typeof obj === "object" && typeof obj.error === "string");
    }

    function showViewCount() {
      fetch(CONFIG.firebaseDbUrl + "/views.json")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (typeof d === "number") {
            $("viewsCount").textContent = d + " views";
          } else if (fbIsRulesError(d)) {
            $("viewsCount").textContent = "views unavailable";
          }
        })
        .catch(function () {});
    }

    function loadViews() {
      if (!CONFIG.firebaseDbUrl || CONFIG.firebaseDbUrl.indexOf("YOUR-PROJECT") !== -1) return;
      getClientIp().then(function (ip) {
        if (!ip) { showViewCount(); return; }
        var rateUrl = CONFIG.firebaseDbUrl + "/viewIps/" + ipKey(ip) + ".json";
        fetch(rateUrl).then(function (r) { return r.json(); }).then(function (lastTs) {
          if (fbIsRulesError(lastTs)) { showViewCount(); return; }
          var now = Date.now();
          if (typeof lastTs === "number" && (now - lastTs) < VIEW_WINDOW_MS) { showViewCount(); return; }
          fetch(CONFIG.firebaseDbUrl + "/views.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ".sv": { "increment": 1 } })
          })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (typeof d === "number") $("viewsCount").textContent = d + " views";
            })
            .catch(function () {});
          fetch(rateUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(now)
          }).catch(function () {});
        }).catch(function () { showViewCount(); });
      });
    }

    /* ---------- presence ---------- */
    function loadPresence() {
      if (!CONFIG.firebaseDbUrl || CONFIG.firebaseDbUrl.indexOf("YOUR-PROJECT") !== -1) return;
      if (typeof firebase === "undefined") return;
      try { firebase.initializeApp({ databaseURL: CONFIG.firebaseDbUrl }); }
      catch (e) { /* already initialized */ }
      var db;
      try { db = firebase.database(); } catch (e) { return; }
      var myId = "p" + Date.now() + Math.random().toString(16).slice(2);
      var myRef = db.ref("presence/" + myId);
      var presenceEl = $("presence");
      var countEl = $("presenceCount");
      db.ref(".info/connected").on("value", function (snap) {
        if (snap.val() !== true) return;
        myRef.onDisconnect().remove();
        myRef.set(true).catch(function () {});
      });
      db.ref("presence").on("value", function (snap) {
        countEl.textContent = snap.numChildren() + " here now";
        presenceEl.hidden = false;
      }, function () { presenceEl.hidden = true; });
    }

    /* ---------- discord profile via dstn ---------- */
    function loadDstn() {
      fetch("https://dcdn.dstn.to/profile/" + CONFIG.id)
        .then(function (r) { return r.json(); })
        .then(function (p) {
          if (!p || !p.user) return;
          var u = p.user;

          var b = $("badges");
          b.innerHTML = "";
          (p.badges || []).forEach(function (bd) {
            var hash = typeof bd.icon === "string" ? bd.icon.replace(/\.(png|gif|webp)$/i, "") : null;
            var src = hash ? badgeUrl(hash) : (bd.icon_url || null);
            if (!src) return;
            var img = document.createElement("img");
            img.src = src;
            img.title = bd.description || bd.id || "";
            img.alt = img.title;
            b.appendChild(img);
          });

          var deco = $("deco");
          var decoData = u.avatar_decoration_data;
          if (decoData && decoData.asset) { deco.src = decoPresetUrl(decoData.asset); showBox(deco); }
          else { hideBox(deco); }

          var pdecoHash = null;
          if (u.profile_effect && typeof u.profile_effect === "string") pdecoHash = u.profile_effect;
          else if (u.profile_effect && u.profile_effect.asset) pdecoHash = u.profile_effect.asset;
          var pdeco = $("pdeco");
          if (pdecoHash) { pdeco.src = profileDecoUrl(pdecoHash); showBox(pdeco); }
          else { hideBox(pdeco); }

          var np = null;
          if (u.collectibles && u.collectibles.nameplate) np = u.collectibles.nameplate;
          else if (u.nameplate) np = u.nameplate;
          var vid = $("nameplate");
          if (np && np.collection && np.name) {
            vid.src = nameplateUrl(np);
            showBox(vid);
            vid.play().catch(function () {});
          } else { hideBox(vid); }

          var bannerEl = $("banner");
          if (u.banner) {
            bannerEl.style.background =
              "url(https://cdn.discordapp.com/banners/" + u.id + "/" + u.banner +
              (u.banner.indexOf("a_") === 0 ? ".gif" : ".png") + "?size=600) center/cover";
          } else {
            var probe = new Image();
            probe.onload = function () {
              bannerEl.style.background = "url(https://dcdn.dstn.to/banners/" + u.id + ") center/cover";
            };
            probe.src = "https://dcdn.dstn.to/banners/" + u.id;
          }

          if (u.display_name || u.global_name) $("uname").textContent = u.display_name || u.global_name;
        })
        .catch(function () {});
    }

    /* ---------- lanyard ---------- */
    function load() {
      fetch("https://api.lanyard.rest/v1/users/" + CONFIG.id)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success) return;
          render(res.data);
          setTimeout(load, 15000);
        })
        .catch(function () { setTimeout(load, 15000); });
    }

    function render(d) {
      var u = d.discord_user;
      discordUser = u.username;

      $("dot").className = d.discord_status === "offline" ? "" : d.discord_status;

      var av = "https://cdn.discordapp.com/embed/avatars/0.png";
      if (u.avatar) {
        av = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar +
             (u.avatar.indexOf("a_") === 0 ? ".gif" : ".png") + "?size=256";
      } else {
        av = "https://dcdn.dstn.to/avatars/" + u.id;
      }
      $("avatar").src = av;

      var deco = $("deco");
      if (u.avatar_decoration_data && u.avatar_decoration_data.asset && !deco.src) {
        deco.src = decoPresetUrl(u.avatar_decoration_data.asset);
        showBox(deco);
      }

      var vid = $("nameplate");
      if (!vid.src && u.collectibles && u.collectibles.nameplate &&
          u.collectibles.nameplate.collection && u.collectibles.nameplate.name) {
        vid.src = nameplateUrl(u.collectibles.nameplate);
        showBox(vid);
        vid.play().catch(function () {});
      }

      $("handle").textContent = "@" + CONFIG.slug;

      var acts = (d.activities || []).filter(function (a) {
        return a.type !== 4 && a.name !== "Spotify";
      });
      if (acts.length) {
        $("acts").innerHTML = "";
        acts.forEach(function (act) {
          var raw = act.assets && (act.assets.large_image || act.assets.small_image);
          var art = "";
          if (raw) {
            if (raw.indexOf("mp:external/") === 0) art = "https://media.discordapp.net/external/" + raw.slice(12);
            else if (raw.indexOf("spotify:") === 0) art = "https://i.scdn.co/image/" + raw.slice(8);
            else art = "https://cdn.discordapp.com/app-assets/" + act.application_id + "/" + raw + ".png";
          }
          var div = document.createElement("div");
          div.className = "act";
          div.innerHTML =
            (art ? '<img src="' + art + '" onerror="this.style.display=\'none\'">' : "") +
            "<div><b>" + escapeHtml(act.name) + "</b>" +
            (act.details ? "<small>" + escapeHtml(act.details) + "</small>" : "") +
            (act.state ? "<small>" + escapeHtml(act.state) + "</small>" : "") + "</div>";
          $("acts").appendChild(div);
        });
        showBox($("actbox"));
      } else {
        hideBox($("actbox"));
      }

      var sp = d.spotify;
      var activelyListening =
        d.listening_to_spotify === true &&
        d.discord_status !== "offline" &&
        sp && sp.track_id && sp.song && sp.artist && sp.album_art_url && sp.timestamps &&
        typeof sp.timestamps.start === "number" && typeof sp.timestamps.end === "number" &&
        sp.timestamps.end > sp.timestamps.start;

      if (activelyListening) {
        var now = Date.now();
        if (now > sp.timestamps.end + 30000) {
          hideBox($("spbox"));
        } else {
          $("spart").src = sp.album_art_url;
          $("song").textContent = sp.song;
          $("song").href = "https://open.spotify.com/track/" + sp.track_id;
          $("artist").textContent = sp.artist;
          var pct = ((now - sp.timestamps.start) / (sp.timestamps.end - sp.timestamps.start)) * 100;
          $("fill").style.width = Math.min(100, Math.max(0, pct)) + "%";
          showBox($("spbox"));
        }
      } else {
        hideBox($("spbox"));
      }
    }

    /* ---------- kick off background tasks (guarded) ---------- */
    try { loadViews(); }    catch (e) { console.warn("loadViews failed", e); }
    try { loadPresence(); } catch (e) { console.warn("loadPresence failed", e); }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
